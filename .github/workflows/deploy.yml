name: Deploy

on:
  workflow_run:
    workflows: ['Build']
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: write
    env:
      S3_BUCKET_NAME: example-bucket-stub
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Event facts
        run: |
          echo "event            = ${{ github.event.workflow_run.event }}"
          echo "head_repository  = ${{ github.event.workflow_run.head_repository.full_name }}"
          echo "base repository  = ${{ github.repository }}"
          echo "conclusion       = ${{ github.event.workflow_run.conclusion }}"
          echo "pull_requests[]  = ${{ toJSON(github.event.workflow_run.pull_requests) }}"
          echo "PR_NUMBER        = [${PR_NUMBER}]"

      # Same action, same pinned SHA, same inputs as the workflow under test.
      - name: Download artifact
        id: download-artifact
        uses: dawidd6/action-download-artifact@09f2f74827fd3a8607589e5ad7f9398816f540fe # v3.1.4
        with:
          workflow_conclusion: success
          run_id: ${{ github.event.workflow_run.id }}
          name: build
          path: artifact
          allow_forks: false

      - name: Deploy (STUB - runs nothing against any cloud provider)
        run: |
          shopt -s inherit_errexit
          set -xeEo pipefail
          aws() { echo "STUB-AWS-WOULD-RUN: aws $*"; }

          echo "::group::branch selection"
          if [[ -z ${PR_NUMBER} ]]; then
            echo "SELECTED_BRANCH=ROOT   (the '# non PR' path)"
          else
            echo "SELECTED_BRANCH=PREVIEW (pr-${PR_NUMBER})"
          fi
          echo "::endgroup::"

          cd ./artifact/storybook-static
          aws configure set default.s3.max_concurrent_requests 200
          if [[ -z ${PR_NUMBER} ]]; then # non PR
            aws s3 sync . "s3://${S3_BUCKET_NAME}/" --delete --exclude 'pr-*/*' --exclude '*.old.css' --exclude '*.diff'
          else
            aws s3 sync . "s3://${S3_BUCKET_NAME}/pr-${PR_NUMBER}/commit-${HEAD_SHA}/" --delete --exclude '*.old.css' --exclude '*.diff'
            aws s3 sync . "s3://${S3_BUCKET_NAME}/pr-${PR_NUMBER}/" --delete --exclude 'commit-*/*' --exclude '*.old.css' --exclude '*.diff'
          fi

          echo "::group::content that would be published"
          cat index.html
          cat _provenance.txt
          echo "::endgroup::"

      - name: Post GitHub comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: ${{ github.event.workflow_run.pull_requests[0].number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `preview for ${{ github.event.workflow_run.head_sha }}`
            })
